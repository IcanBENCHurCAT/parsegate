name: "Pull Request Labeler"
on:
- pull_request_target
- workflow_dispatch

jobs:
  triage:
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v7
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"

