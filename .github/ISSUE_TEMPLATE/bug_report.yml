name: Bug Report
description: Create a report to help us improve Parsegate
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Send request '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: E.g., Ubuntu 22.04
  - type: input
    id: node-version
    attributes:
      label: Node Version
      description: E.g., 20.10.0
  - type: input
    id: network
    attributes:
      label: Network
      description: E.g., Mainnet, Testnet
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here, such as logs, transaction IDs, or error messages.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
